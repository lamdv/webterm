# Build and test the desktop client, and publish bundles on a tag.
#
# The client is a plain Rust/Tauri app: no Python, no embedded interpreter, no
# portable CPython download.

name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

defaults:
  run:
    shell: bash

env:
  # The Linux webview and packaging libraries Tauri needs to link against.
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  rust:
    name: rust fmt + clippy + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: cargo fmt
        working-directory: desktop
        run: cargo fmt --all --check
      - name: cargo clippy
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: desktop
        run: cargo test -p webterm-client -p webterm-desktop

  server:
    name: server lint + tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run python -m unittest discover -s tests -t .

  build:
    name: build (${{ matrix.target }})
    needs: [rust, server]
    permissions:
      contents: write # for publishing a release on tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos-14
            target: aarch64-apple-darwin
          - platform: macos-14
            target: x86_64-apple-darwin
          - platform: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Build bundles
        working-directory: desktop
        run: |
          npx --yes @tauri-apps/cli@^2 build --target "${{ matrix.target }}"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: webterm-desktop-${{ matrix.target }}
          if-no-files-found: error
          # The workspace keeps build output at desktop/target, not
          # desktop/src-tauri/target.
          path: |
            desktop/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/target/${{ matrix.target }}/release/bundle/**/*.rpm
            desktop/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            desktop/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/target/${{ matrix.target }}/release/bundle/**/*.exe

      - name: Publish release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: desktop/target/${{ matrix.target }}/release/bundle/**
