<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>webterm</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"
      integrity="sha384-8Xk9wy/gzEDUKrXtrmCFa2bBuK3BpjpDuL/p0SeKQX19Khl/M+lHOgD/CyYf7efP"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="sidebar-header">
          <div class="sidebar-header-top">
            <span class="brand">webterm</span>
            <button
              id="sidebar-collapse"
              title="Collapse sidebar (Ctrl+Shift+B)"
              aria-label="Collapse sidebar"
              aria-expanded="true"
            >
              ‹
            </button>
          </div>
          <div id="sidebar-actions">
            <button
              id="new-session"
              title="New shell (Ctrl+Shift+N) · long-press or right-click to pick a session type, name it, or add a precommand"
            >
              + new
            </button>
          </div>
        </header>
        <div id="launchers"></div>
        <ul id="sessions"></ul>
        <footer id="status">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">connecting…</span>
          <button
            id="restart-server"
            title="Restart the server (closes all sessions)"
            aria-label="Restart server"
          >
            ⟳
          </button>
        </footer>
      </aside>
      <div
        id="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        tabindex="0"
        title="Drag to resize · double-click to reset"
      ></div>
      <main id="main">
        <button
          id="sidebar-expand"
          title="Expand sidebar (Ctrl+Shift+B)"
          aria-label="Expand sidebar"
          aria-expanded="false"
          hidden
        >
          ›
        </button>
        <div id="terminal-area"></div>
        <div id="empty-state" hidden>
          <p>No sessions running.</p>
          <div id="empty-choices" class="empty-choices"></div>
        </div>
      </main>
    </div>
    <div id="new-session-popover" class="popover" role="dialog" aria-label="New session" hidden>
      <form id="new-session-form">
        <div
          id="new-session-kinds"
          class="popover-kinds"
          role="radiogroup"
          aria-label="Session type"
        >
          <button type="button" data-kind="shell" role="radio" aria-checked="true">
            Shell
          </button>
          <button type="button" data-kind="pi" role="radio" aria-checked="false">
            pi chat
          </button>
        </div>
        <div id="new-session-shell-fields">
          <label for="new-session-name">Name <span class="hint">(optional)</span></label>
          <input
            id="new-session-name"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Session name"
          />
          <label for="new-session-command"
            >Precommand <span class="hint">(optional)</span></label
          >
          <input
            id="new-session-command"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="e.g. cd ~/src && ls"
          />
        </div>
        <div id="new-session-pi-fields" hidden>
          <label for="new-session-model">Model</label>
          <div class="popover-row">
            <select id="new-session-model">
              <option value="">Default</option>
            </select>
            <button
              type="button"
              id="new-session-model-refresh"
              title="Reload the model list from pi"
              aria-label="Reload the model list"
            >
              ↻
            </button>
          </div>
        </div>
        <div class="popover-actions">
          <button type="button" id="new-session-cancel">Cancel</button>
          <button type="submit" id="new-session-create">Create</button>
        </div>
      </form>
    </div>
    <div id="launcher-popover" class="popover" role="dialog" aria-label="Add a command" hidden>
      <form id="launcher-form">
        <label for="launcher-command">Command</label>
        <input
          id="launcher-command"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="e.g. htop"
          required
        />
        <label for="launcher-name">Name <span class="hint">(optional)</span></label>
        <input
          id="launcher-name"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Pill label"
        />
        <div class="popover-actions">
          <button type="button" id="launcher-cancel">Cancel</button>
          <button type="submit" id="launcher-create">Create</button>
        </div>
      </form>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"
      integrity="sha384-M169f14mRZOXm3hD/v2Ti0ThIT/RnAQagXA9nlE15yHAtrW19gdePJh/HaTzUOe/"
      crossorigin="anonymous"
    ></script>
    <script src="/config.js"></script>
    <script src="/highlight.js"></script>
    <script src="/views.js"></script>
    <script src="/find.js"></script>
    <script src="/pathcomplete.js"></script>
    <script src="/attach.js"></script>
    <script src="/pi.js"></script>
    <script src="/agent.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
