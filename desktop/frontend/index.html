<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webterm</title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <main class="picker">
      <header class="picker-head">
        <h1>webterm</h1>
        <p class="dim">connect to a server</p>
      </header>

      <p id="error" class="error" role="alert" hidden></p>

      <ul id="servers" class="servers" aria-label="saved servers"></ul>
      <p id="empty" class="note" hidden>
        No servers yet. Add the address of a webterm server below.
      </p>

      <form id="add-form" class="add-form" autocomplete="off">
        <h2>Add a server</h2>

        <label class="field">
          <span>Name</span>
          <input id="name" type="text" placeholder="Dev box" required />
        </label>

        <label class="field">
          <span>URL</span>
          <input
            id="url"
            type="url"
            placeholder="https://webterm.example.com"
            required
          />
        </label>

        <label class="field">
          <span>Authentication</span>
          <select id="auth">
            <option value="none">None</option>
            <option value="token">Shared token</option>
            <option value="browser">Browser login</option>
          </select>
        </label>

        <label id="token-row" class="field" hidden>
          <span>Token</span>
          <input id="token" type="password" autocomplete="off" />
        </label>

        <div class="form-actions">
          <button type="submit" class="primary" id="submit">Add server</button>
          <button type="button" id="cancel" hidden>Cancel</button>
        </div>
      </form>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
