[project]
name = "webterm-desktop"
version = "0.1.0"
description = "Tauri desktop shell for webterm (PyTauri host)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "anyio>=4",
    "pydantic>=2",
    "pytauri==0.8.*",
    "pytauri-wheel==0.8.*",
    "webterm",
]

[project.scripts]
webterm-desktop = "webterm_desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webterm_desktop"]

[tool.hatch.build]
# The placeholder/real frontend asset dir is not Python source.
artifacts = ["src/webterm_desktop/frontend/"]

[tool.uv.sources]
# The desktop app embeds the real server; install it editable from the parent
# package rather than duplicating it.
webterm = { path = "..", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
