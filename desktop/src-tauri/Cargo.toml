[package]
name = "webterm-desktop"
version = "0.1.0"
description = "webterm desktop app"
authors = ["webterm"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a bin/lib name clash (notably on Windows).
name = "webterm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "webterm-desktop"
path = "src/main.rs"
required-features = ["pytauri/standalone"]

[build-dependencies]
tauri-build = { version = "=2.4.0", features = [] }

[dependencies]
# These versions mirror pytauri v0.8.0's own Cargo.lock.  The tauri stack and
# wry must move together: newer wry/tauri-utils break pytauri-core 0.8.0 (e.g.
# tauri-utils >=2.10 made `WindowEffect` #[non_exhaustive] while pytauri's
# effect_impl! macro has no wildcard arm), and a newer wry adds trait methods
# that tauri-runtime-wry 2.8.0 does not implement.
#
# `tray-icon` enables the system tray (best-effort at runtime on Linux).
tauri = { version = "=2.8.3", features = ["tray-icon"] }
tauri-utils = "=2.7.0"
tauri-runtime = "=2.8.0"
tauri-runtime-wry = "=2.8.0"
wry = "=0.53.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.25" }
# The bundled app must compile in the plugins the Python host imports
# (pytauri-wheel includes them all in development).
pytauri = { version = "0.8", features = ["plugin-single-instance", "plugin-window-state"] }
tauri-plugin-pytauri = { version = "0.8" }
