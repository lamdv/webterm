[package]
name = "webterm-desktop"
description = "webterm desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a bin/lib name clash (notably on Windows).  The extra
# crate types are what iOS and Android link against, so they are here from the
# start rather than bolted on later.
name = "webterm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "webterm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-http.workspace = true
tauri-plugin-single-instance.workspace = true
serde.workspace = true
serde_json.workspace = true
webterm-client.workspace = true

[lints]
workspace = true
