[package]
name = "webterm-desktop"
version = "0.1.0"
description = "webterm desktop app"
authors = ["webterm"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a bin/lib name clash (notably on Windows).
name = "webterm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "webterm-desktop"
path = "src/main.rs"
required-features = ["pytauri/standalone"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` enables the system tray (best-effort at runtime on Linux).
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.25" }
pytauri = { version = "0.8", features = [] }
tauri-plugin-pytauri = { version = "0.8" }
