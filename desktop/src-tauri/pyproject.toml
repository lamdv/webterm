[project]
name = "webterm-desktop"
version = "0.1.0"
description = "webterm desktop app (bundled / standalone build)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# NOTE: the webterm server package itself is installed separately by the build
# script/workflow (from the repo root), because a path dependency here would be
# resolved relative to this file.
dependencies = [
    "anyio == 4.*",
    "pydantic == 2.*",
    "pytauri == 0.8.*",
]

[project.entry-points.pytauri]
ext_mod = "webterm_desktop.ext_mod"

[build-system]
requires = ["setuptools >= 80"]
build-backend = "setuptools.build_meta"

# Package the same Python source the wheel/dev build uses, from ../src.
[tool.setuptools]
package-dir = { "" = "../src" }

[tool.setuptools.packages.find]
where = ["../src"]
include = ["webterm_desktop*"]
